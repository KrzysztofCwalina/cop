name: CI

# There was previously NO automated CI in this repo: tests were never run on push/PR and
# the self-contained cop.exe (which the end-to-end tests spawn) was never gated. This
# workflow makes the holistic test suite a required gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build, publish & test (windows)
    # windows-latest: the end-to-end tests spawn install/win-x64/cop.exe by that exact path.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned TypeScript compiler
        shell: pwsh
        run: |
          npm install --global typescript@6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript compiler installation failed.' }
          tsc --version
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript compiler is not available on PATH.' }

      - name: Setup pinned Rust build toolchain
        shell: pwsh
        run: |
          $version = (Get-Content providers/rust-provider/native/stdlib.json -Raw | ConvertFrom-Json).release
          rustup toolchain install $version --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          "RUSTUP_TOOLCHAIN=$version" | Add-Content $env:GITHUB_ENV

      - name: Cache Rust build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            providers/rust-provider/native/target
            install/native-bundles/inputs
          key: ${{ runner.os }}-rust-frontend-${{ hashFiles('providers/rust-provider/native/Cargo.lock', 'providers/rust-provider/native/stdlib.json') }}

      # Publishes the self-contained win-x64 cop.exe AND builds every provider DLL.
      # The E2E tests (DocSnippet*/Walkthrough/DocExamples/Sample/Demo/CliCommand) run this
      # exact published binary, so publishing first is what makes them meaningful. A publish
      # failure (e.g. a provider that no longer builds) fails CI here.
      - name: Publish cop.exe (win-x64) + providers
        shell: pwsh
        run: ./install/publish.ps1 -Runtimes win-x64

      # NOTE: do NOT `dotnet test cop.sln` — the solution has two projects named "cop"
      # (MSB5004). Test each project file directly.
      - name: Core tests (Cop.Tests)
        shell: pwsh
        run: dotnet test tests/Cop.Tests/Cop.Tests.csproj -c Debug --logger "console;verbosity=normal"

      - name: Language tests (Lang.Tests)
        shell: pwsh
        run: dotnet test tests/lang.tests/Lang.Tests.csproj -c Debug --logger "console;verbosity=normal"

  # Informational: runs the tests that pin documented-but-currently-broken
  # behavior (tagged [Category("PendingFix")] + [Explicit]). These are runnable specs for
  # filed bugs. Assertion failures are reported in the summary without a red check;
  # build/runner failures still fail the job. When a fix lands, remove the [Explicit] tag so the
  # test moves into the blocking `test` job above and can never silently regress again.
  pending-fix-ledger:
    name: Known-bug ledger (non-blocking)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned TypeScript compiler
        shell: pwsh
        run: |
          npm install --global typescript@6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript compiler installation failed.' }
          tsc --version
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript compiler is not available on PATH.' }

      - name: Setup pinned Rust build toolchain
        shell: pwsh
        run: |
          $version = (Get-Content providers/rust-provider/native/stdlib.json -Raw | ConvertFrom-Json).release
          rustup toolchain install $version --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          "RUSTUP_TOOLCHAIN=$version" | Add-Content $env:GITHUB_ENV

      - name: Cache Rust build inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            providers/rust-provider/native/target
            install/native-bundles/inputs
          key: ${{ runner.os }}-rust-frontend-${{ hashFiles('providers/rust-provider/native/Cargo.lock', 'providers/rust-provider/native/stdlib.json') }}

      - name: Publish cop.exe (win-x64) + providers
        shell: pwsh
        run: ./install/publish.ps1 -Runtimes win-x64

      - name: Build known-bug tests
        shell: pwsh
        run: dotnet build tests/Cop.Tests/Cop.Tests.csproj -c Debug

      - name: Report PendingFix specs
        shell: pwsh
        # Only completed test failures are informational, not arbitrary nonzero exit codes.
        run: |
          $resultsDir = Join-Path $env:RUNNER_TEMP ("cop-pending-fix-" + [guid]::NewGuid().ToString('N'))
          dotnet test tests/Cop.Tests/Cop.Tests.csproj -c Debug --no-build --no-restore --filter "TestCategory=PendingFix" --logger "console;verbosity=normal" --logger "trx;LogFileName=pending-fix.trx" --results-directory $resultsDir
          $testExit = $LASTEXITCODE
          if ($testExit -notin 0, 1) { throw "Known-bug test runner failed (exit $testExit)." }

          $trxPath = Join-Path $resultsDir 'pending-fix.trx'
          if (-not (Test-Path -LiteralPath $trxPath)) { throw 'Known-bug test runner produced no TRX report.' }
          [xml]$report = Get-Content -LiteralPath $trxPath -Raw
          $counters = $report.TestRun.ResultSummary.Counters
          if ($null -eq $counters) { throw 'Known-bug TRX report has no counters.' }
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $results = @($report.TestRun.Results.UnitTestResult)
          $passedResults = @($results | Where-Object outcome -eq 'Passed')
          $failedResults = @($results | Where-Object outcome -eq 'Failed')
          if ($total -le 0 -or [int]$counters.executed -ne $total -or
              $passed + $failed -ne $total -or $results.Count -ne $total -or
              $passedResults.Count -ne $passed -or $failedResults.Count -ne $failed -or
              [int]$counters.error -ne 0 -or [int]$counters.timeout -ne 0 -or
              [int]$counters.aborted -ne 0 -or
              @($report.TestRun.ResultSummary.RunInfos.RunInfo | Where-Object outcome -eq 'Error').Count -gt 0 -or
              ($testExit -eq 0) -ne ($failed -eq 0)) {
            throw "Known-bug test run did not complete normally (exit $testExit). See the TRX artifact."
          }

          $summary = @(
            '## Known-bug ledger',
            '',
            "$total tests completed: $failed still failing, $passed passing.",
            'Failures below are documented PendingFix specs, not failures of the required test suites.',
            'Review passing specs and remove their Explicit/PendingFix tags once the fix is confirmed.',
            ''
          )
          foreach ($result in $failedResults) { $summary += "- Still failing: $($result.testName)" }
          foreach ($result in $passedResults) { $summary += "- Now passing: $($result.testName)" }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Write-Host "Known-bug ledger: $failed documented failures, $passed passing specs. See the job summary and TRX artifact."
          exit 0

      - name: Upload known-bug test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-bug-test-results
          path: ${{ runner.temp }}/cop-pending-fix-*/*.trx
          if-no-files-found: ignore
