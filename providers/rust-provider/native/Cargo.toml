[package]
name = "cop-rust-frontend"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
ra_ap_hir = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_cfg = "=0.0.358"
ra_ap_base_db = "=0.0.358"
ra_ap_span = "=0.0.358"
ra_ap_intern = "=0.0.358"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
triomphe = "0.1"
toml = "0.9"
semver = "1"
cargo-platform = "0.3"

[profile.release]
strip = true
lto = "thin"
