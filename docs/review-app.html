<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cop Package Reference Review</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; color: #24292f; }

/* Sidebar */
.sidebar { width: 320px; border-right: 1px solid #d0d7de; overflow-y: auto; background: #f6f8fa; padding: 12px 0; flex-shrink: 0; }
.sidebar h2 { padding: 8px 16px; font-size: 14px; color: #57606a; text-transform: uppercase; letter-spacing: 0.5px; }
.tree-node { cursor: pointer; user-select: none; }
.tree-label { display: flex; align-items: center; padding: 4px 16px; font-size: 13px; border-radius: 6px; margin: 1px 8px; }
.tree-label:hover { background: #eaeef2; }
.tree-label.active { background: #ddf4ff; color: #0969da; font-weight: 600; }
.tree-toggle { width: 16px; font-size: 10px; color: #57606a; flex-shrink: 0; }
.tree-icon { margin-right: 6px; font-size: 12px; }
.tree-children { padding-left: 16px; }
.tree-children.collapsed { display: none; }
.category-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #57606a; letter-spacing: 0.5px; padding: 12px 16px 4px; }

/* Main content */
.main { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 960px; }
.main h1 { font-size: 24px; margin-bottom: 8px; }
.main h2 { font-size: 18px; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #d0d7de; }
.main h3 { font-size: 15px; margin: 16px 0 8px; }

/* Property row */
.prop-row { display: flex; align-items: center; padding: 5px 8px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.prop-row:hover { background: #f6f8fa; }
.prop-name { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; width: 200px; flex-shrink: 0; }
.prop-type { color: #6639ba; width: 180px; flex-shrink: 0; font-family: monospace; font-size: 12px; }
.prop-desc { flex: 1; color: #57606a; }

/* Item row (for predicates, functions, checks) */
.item-row { display: flex; align-items: center; padding: 6px 8px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.item-row:hover { background: #f6f8fa; }
.item-name { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; flex: 1; }
.item-type { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; color: #8250df; margin-left: 8px; flex-shrink: 0; }
.item-type a.type-nav-link { color: #8250df; text-decoration: none; border-bottom: 1px dotted #8250df; }
.item-type a.type-nav-link:hover { color: #6639ba; border-bottom-style: solid; }
.item-detail { color: #57606a; font-size: 12px; margin-left: 12px; }

/* Comment button and input */
.comment-btn { cursor: pointer; font-size: 14px; margin-left: 8px; opacity: 0.3; transition: opacity 0.2s; flex-shrink: 0; }
.comment-btn:hover { opacity: 1; }
.comment-btn.has-comment { opacity: 1; color: #0969da; }
.comment-input { display: none; width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 28px; }
.comment-input.visible { display: block; }
.comment-wrapper { width: 100%; }

/* Toolbar */
.toolbar { position: fixed; top: 12px; right: 24px; display: flex; gap: 8px; z-index: 100; }
.toolbar button { padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
.toolbar button:hover { background: #f3f4f6; }
.toolbar button.primary { background: #2da44e; color: #fff; border-color: #2da44e; }
.toolbar button.primary:hover { background: #2c974b; }
.badge { background: #0969da; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 11px; margin-left: 4px; }

/* Collection header */
.collection-header { display: flex; align-items: center; padding: 5px 8px; background: #f6f8fa; border-bottom: 1px solid #eaeef2; font-size: 13px; font-weight: 600; }

/* Section tag */
.section-tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 6px; }
.tag-type { background: #ddf4ff; color: #0969da; }
.tag-predicate { background: #fff8c5; color: #9a6700; }
.tag-function { background: #dcffe4; color: #1a7f37; }
.tag-check { background: #ffebe9; color: #cf222e; }
.tag-command { background: #fbefff; color: #8250df; }
.tag-let { background: #eaeef2; color: #57606a; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Packages</h2>
  <div id="tree"></div>
</div>

<div class="main" id="content">
  <h1>Cop Package Reference Review</h1>
  <p style="color:#57606a; margin-top:8px;">Select an item from the tree to view details. Click 💬 to add comments. Submit to queue when done.</p>
</div>

<div class="toolbar">
  <button onclick="submitToCopilot()" class="primary">Submit to Copilot <span class="badge" id="commentCount">0</span></button>
  <button onclick="reviewPending()">Review Pending</button>
  <button onclick="exportComments()">Export JSON</button>
  <button onclick="clearAllComments()">Clear All</button>
</div>

<script>
// === PACKAGE DATA ===
const categories = [
  { name: "Core", packages: ["code", "code-analysis", "filesystem", "markdown"] },
  { name: "TypeSpec", packages: ["typespec", "typespec-http"] },
  { name: "Utilities", packages: ["arch-layering", "http", "json"] },

  { name: "Python", packages: ["python", "python-library", "python-library-client", "python-library-client-azure"] },
  { name: "JavaScript", packages: ["javascript", "javascript-library", "javascript-library-client", "javascript-library-client-azure"] }

const packages = {

          { name: "EnumValues", type: "[string]", desc: "Enum member names" },

          { name: "Events", type: "[Event]", desc: "Event declarations" },
          { name: "Line", type: "int", desc: "Source line number" },
          { name: "File", type: "File?", desc: "Containing source file" },
          { name: "Source", type: "string", desc: "Source text of the declaration" },
          { name: "Documented", type: "bool", desc: "Has documentation comment" },
          { name: "Documentation", type: "string?", desc: "Doc comment text (nic if not documented)" }
        ]
      },
      Method: {
        props: [
          { name: "Name", type: "string", desc: "Method name" },
          { name: "Modifiers", type: "int", desc: "Modifier bitfield" },
          { name: "ReturnType", type: "TypeReference?", desc: "Return type (nil for constructors/void)" },
          { name: "Parameters", type: "[Parameter]", desc: "Parameter declarations" },
          { name: "Statements", type: "[Statement]", desc: "Statements within method body" },
          { name: "Decorators", type: "[string]", desc: "Attributes/decorators" },
          { name: "Line", type: "int", desc: "Source line number" },

        ]
      },
      Statement: {
        props: [
          { name: "Kind", type: "string", desc: "declaration, call, throw, catch, return, using, foreach, await" },
          { name: "Keywords", type: "[string]", desc: "Language keywords" },
          { name: "TypeName", type: "string?", desc: "Receiver type name" },
          { name: "MemberName", type: "string?", desc: "Member name" },
          { name: "Arguments", type: "[string]", desc: "Call arguments" },
          { name: "Line", type: "int", desc: "Source line number" },
          { name: "InMethod", type: "bool", desc: "Inside a method body" },
          { name: "Rethrows", type: "bool", desc: "Rethrows caught exception" },
          { name: "Generic", type: "bool", desc: "Uses generic type parameters" },

      },
      Call: {

          { name: "MemberName", type: "string?", desc: "Called method name" },
          { name: "Arguments", type: "[string]", desc: "Call arguments" },
          { name: "Line", type: "int", desc: "Source line number" },
          { name: "File", type: "File?", desc: "Containing file" },
          { name: "Source", type: "string", desc: "Source text" },
          { name: "Method", type: "Method?", desc: "Enclosing method" }

          { name: "Generic", type: "bool", desc: "Catches generic Exception type" },
          { name: "Children", type: "[Statement]", desc: "Child statements" },
          { name: "Line", type: "int", desc: "Source line number" },
          { name: "File", type: "File?", desc: "Containing file" },
          { name: "Source", type: "string", desc: "Source text" }
        ]
      },
      Attribute: {
        props: [
          { name: "TypeName", type: "string?", desc: "Attribute type name" },
          { name: "Arguments", type: "[string]", desc: "Attribute arguments" },
          { name: "Line", type: "int", desc: "Source line number" },
          { name: "File", type: "File?", desc: "Containing file" },
          { name: "Source", type: "string", desc: "Source text" }
        ]
      },
      Line: {
        props: [
          { name: "Text", type: "string", desc: "Raw text content" },
          { name: "Number", type: "int", desc: "Line number" },
          { name: "File", type: "File?", desc: "Containing file" },
          { name: "Source", type: "string", desc: "Same as Text" }
        ]
      },
      File: {
        props: [
          { name: "Path", type: "string", desc: "Relative file path" },
          { name: "Language", type: "string?", desc: "Language (csharp, python, etc.)" },
          { name: "Namespace", type: "string?", desc: "Declared namespace" },
          { name: "Usings", type: "[string]", desc: "Import/using directives" },
          { name: "Types", type: "[Type]", desc: "Type declarations in file" }
        ]
      },
      Api: {
        props: [
          { name: "Kind", type: "string", desc: "Entry kind (type, method, field, property, event)" },
          { name: "TypeName", type: "string", desc: "Declaring type name" },
          { name: "MemberName", type: "string", desc: "Member name" },
          { name: "Signature", type: "string", desc: "Full signature text" },
          { name: "ApiAsText", type: "string", desc: "Formatted API surface text" },
          { name: "Line", type: "int", desc: "Source line number" },
          { name: "File", type: "File?", desc: "Containing file" },
          { name: "Source", type: "string", desc: "Source text" }
        ]
      },
      Member: {
        props: [
          { name: "Name", type: "string", desc: "Member name" },
          { name: "DeclaringType", type: "string", desc: "Declaring type name" },
          { name: "Line", type: "int", desc: "Source line number" }
        ]
      },
      Region: {
        props: [
          { name: "Name", type: "string", desc: "Region name" },
          { name: "StartLine", type: "int", desc: "Start line number" },
          { name: "EndLine", type: "int", desc: "End line number" },
          { name: "Content", type: "string", desc: "Region content text" },
          { name: "ContentHash", type: "string", desc: "Hash of content" },

          { name: "Source", type: "string", desc: "Raw region source" }
        ]
      },
      Project: {
        props: [
          { name: "Name", type: "string", desc: "Project/package name" },
          { name: "Path", type: "string", desc: "Relative path to manifest" },
          { name: "Language", type: "string?", desc: "Language" },
          { name: "References", type: "[string]", desc: "Referenced project names" }
        ]
      },
      Codebase: {
        props: [
          { name: "Projects", type: "[Project]", desc: "All projects in the codebase" },
          { name: "Files", type: "[File]", desc: "All source files" }
        ]
      }
    },
    predicates: [
      { name: "isPublic", appliesTo: "Type", desc: "Type has Public modifier" },
      { name: "isSealed", appliesTo: "Type", desc: "Type has Sealed modifier" },
      { name: "isAbstract", appliesTo: "Type", desc: "Type has Abstract modifier" },
      { name: "isStatic", appliesTo: "Type", desc: "Type has Static modifier" },
      { name: "isDocumented", appliesTo: "Type", desc: "Type has documentation comment" },
      { name: "isPublic", appliesTo: "Method", desc: "Method has Public modifier" },
      { name: "isProtected", appliesTo: "Method", desc: "Method has Protected modifier" },
      { name: "isPrivate", appliesTo: "Method", desc: "Method has Private modifier" },
      { name: "isInternal", appliesTo: "Method", desc: "Method has Internal modifier" },

      { name: "isAbstract", appliesTo: "Method", desc: "Method has Abstract modifier" },
      { name: "isVirtual", appliesTo: "Method", desc: "Method has Virtual modifier" },
      { name: "isOverride", appliesTo: "Method", desc: "Method has Override modifier" },
      { name: "isDocumented", appliesTo: "Method", desc: "Method has documentation comment" },
      { name: "isPublic", appliesTo: "Field", desc: "Field has Public modifier" },
      { name: "isPrivate", appliesTo: "Field", desc: "Field has Private modifier" },
      { name: "isProtected", appliesTo: "Field", desc: "Field has Protected modifier" },
      { name: "isInternal", appliesTo: "Field", desc: "Field has Internal modifier" },
      { name: "isStatic", appliesTo: "Field", desc: "Field has Static modifier" },

// === STATE ===
let comments = JSON.parse(localStorage.getItem('cop-review-comments') || '{}');
let activeNode = null;

// === TREE RENDERING ===
function buildTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';

  for (const cat of categories) {
    const catDiv = document.createElement('div');
    catDiv.innerHTML = `<div class="category-label">${cat.name}</div>`;
    tree.appendChild(catDiv);

    for (const pkgId of cat.packages) {
      const pkg = packages[pkgId];
      if (!pkg) continue;
      const pkgNode = document.createElement('div');
      pkgNode.className = 'tree-node';

      const hasTypes = pkg.types && Object.keys(pkg.types).length > 0;
      const hasPreds = pkg.predicates && pkg.predicates.length > 0;
      const hasFuncs = pkg.functions && pkg.functions.length > 0;
      const hasChecks = pkg.checks && pkg.checks.length > 0;
      const hasCmds = pkg.commands && pkg.commands.length > 0;
      const hasLets = pkg.lets && pkg.lets.length > 0;

      pkgNode.innerHTML = `
        <div class="tree-label" data-pkg="${pkgId}">
          <span class="tree-toggle">▶</span>
          <span class="tree-icon">📦</span>
          <span>${pkg.label}</span>
        </div>
        <div class="tree-children collapsed"></div>
      `;
      const childrenDiv = pkgNode.querySelector('.tree-children');

      if (hasTypes) {
        const secNode = document.createElement('div');
        secNode.className = 'tree-node';
        secNode.innerHTML = `
          <div class="tree-label" data-pkg="${pkgId}" data-section="types-header">
            <span class="tree-toggle">▶</span>
            <span class="section-tag tag-type">T</span>
            <span>Types</span>
          </div>
          <div class="tree-children collapsed"></div>
        `;
        const typesChildren = secNode.querySelector('.tree-children');
        for (const typeName of Object.keys(pkg.types).sort()) {
          const typeNode = document.createElement('div');
          typeNode.className = 'tree-node';
          typeNode.innerHTML = `
            <div class="tree-label" data-pkg="${pkgId}" data-type="${typeName}">
              <span class="tree-toggle" style="visibility:hidden"></span>
              <span class="tree-icon">◆</span>
              <span>${typeName}</span>
            </div>
          `;
          typesChildren.appendChild(typeNode);
        }
        childrenDiv.appendChild(secNode);
      }

      if (hasPreds) {
        const secNode = document.createElement('div');
        secNode.className = 'tree-node';
        secNode.innerHTML = `
          <div class="tree-label" data-pkg="${pkgId}" data-view="predicates">
            <span class="tree-toggle" style="visibility:hidden"></span>
            <span class="section-tag tag-predicate">P</span>
            <span>Predicates (${pkg.predicates.length})</span>
          </div>
        `;
        childrenDiv.appendChild(secNode);
      }

      if (hasFuncs) {
        const secNode = document.createElement('div');
        secNode.className = 'tree-node';
        secNode.innerHTML = `
          <div class="tree-label" data-pkg="${pkgId}" data-view="functions">
            <span class="tree-toggle" style="visibility:hidden"></span>
            <span class="section-tag tag-function">F</span>
            <span>Functions (${pkg.functions.length})</span>
          </div>
        `;
        childrenDiv.appendChild(secNode);
      }

      if (hasChecks) {
        const secNode = document.createElement('div');
        secNode.className = 'tree-node';
        secNode.innerHTML = `
          <div class="tree-label" data-pkg="${pkgId}" data-view="checks">
            <span class="tree-toggle" style="visibility:hidden"></span>
            <span class="section-tag tag-check">C</span>
            <span>Checks (${pkg.checks.length})</span>
          </div>
        `;
        childrenDiv.appendChild(secNode);
      }

      if (hasCmds) {
        const secNode = document.createElement('div');
        secNode.className = 'tree-node';
        secNode.innerHTML = `
          <div class="tree-label" data-pkg="${pkgId}" data-view="commands">
            <span class="tree-toggle" style="visibility:hidden"></span>
            <span class="section-tag tag-command">!</span>
            <span>Commands (${pkg.commands.length})</span>
          </div>
        `;
        childrenDiv.appendChild(secNode);
      }

      if (hasLets) {
        const secNode = document.createElement('div');
        secNode.className = 'tree-node';
        secNode.innerHTML = `
          <div class="tree-label" data-pkg="${pkgId}" data-view="lets">
            <span class="tree-toggle" style="visibility:hidden"></span>
            <span class="section-tag tag-let">L</span>
            <span>Globals (${pkg.lets.length})</span>
          </div>
        `;
        childrenDiv.appendChild(secNode);
      }

      tree.appendChild(pkgNode);
    }
  }

  // Event delegation
  tree.addEventListener('click', (e) => {
    const label = e.target.closest('.tree-label');
    if (!label) return;
    const pkg = label.dataset.pkg;
    const type = label.dataset.type;
    const view = label.dataset.view;
    const section = label.dataset.section;

    if (type) {
      document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
      label.classList.add('active');
      renderType(pkg, type);
    } else if (view) {
      document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
      label.classList.add('active');
      if (view === 'predicates') renderPredicates(pkg);
      else if (view === 'functions') renderFunctions(pkg);
      else if (view === 'checks') renderChecks(pkg);
      else if (view === 'commands') renderCommands(pkg);
      else if (view === 'lets') renderLets(pkg);
    } else if (section) {
      // Toggle section expand
      const children = label.nextElementSibling;
      const toggle = label.querySelector('.tree-toggle');
      if (children) {
        children.classList.toggle('collapsed');
        toggle.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
      }
    } else {
      // Toggle package expand
      const children = label.nextElementSibling;
      const toggle = label.querySelector('.tree-toggle');
      if (children) {
        children.classList.toggle('collapsed');
        toggle.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
      }
    }
  });
}

// === CONTENT RENDERING ===
function renderType(pkgId, typeName) {
  const pkg = packages[pkgId];
  const type = pkg.types[typeName];
  const content = document.getElementById('content');

  let html = `<h1>${pkg.label} <span style="color:#57606a; font-weight:400">›</span> ${typeName}</h1>`;
  if (pkg.collections && pkg.collections.length > 0) {
    html += `<p style="color:#57606a; font-size:13px; margin-top:4px;">Collections: <code>${pkg.collections.join('</code>, <code>')}</code></p>`;
  }
  html += `<h2>Properties</h2>`;

  for (const prop of type.props) {
    const key = `${pkgId}.${typeName}.${prop.name}`;
    const hasComment = comments[key] ? 'has-comment' : '';
    html += `
      <div class="comment-wrapper">
        <div class="prop-row">
          <span class="prop-name">${prop.name}</span>
          <span class="prop-type">${escapeHtml(prop.type)}</span>
          <span class="prop-desc">${escapeHtml(prop.desc)}</span>
          <span class="comment-btn ${hasComment}" data-key="${key}" title="Add comment">💬</span>
        </div>
        <textarea class="comment-input ${comments[key] ? 'visible' : ''}" data-key="${key}" placeholder="Add comment...">${comments[key] || ''}</textarea>
      </div>
    `;
  }

  content.innerHTML = html;
  wireUpComments(content);
}

function renderPredicates(pkgId) {
  const pkg = packages[pkgId];
  const content = document.getElementById('content');

  let html = `<h1>${pkg.label} <span style="color:#57606a; font-weight:400">›</span> Predicates</h1>`;
  html += `<p style="color:#57606a; font-size:13px; margin-top:4px; margin-bottom:16px;">${pkg.predicates.length} exported predicates</p>`;

  // Group by appliesTo
  const groups = {};
  for (const p of pkg.predicates) {
    if (!groups[p.appliesTo]) groups[p.appliesTo] = [];
    groups[p.appliesTo].push(p);
  }

  for (const [appliesTo, preds] of Object.entries(groups).sort(([a],[b]) => a.localeCompare(b))) {
    html += `<h3>On ${appliesTo}</h3>`;
    for (const pred of preds.sort((a,b) => a.name.localeCompare(b.name))) {
      const key = `${pkgId}.pred.${pred.name}.${pred.appliesTo}`;
      const hasComment = comments[key] ? 'has-comment' : '';
      const retInfo = pred.returns ? ` → ${pred.returns}` : '';
      html += `
        <div class="comment-wrapper">
          <div class="item-row">
            <span class="item-name">${pred.name}(${pred.appliesTo})${retInfo}</span>
            <span class="item-detail">${escapeHtml(pred.desc)}</span>
            <span class="comment-btn ${hasComment}" data-key="${key}" title="Add comment">💬</span>
          </div>
          <textarea class="comment-input ${comments[key] ? 'visible' : ''}" data-key="${key}" placeholder="Add comment...">${comments[key] || ''}</textarea>
        </div>
      `;
    }
  }

  content.innerHTML = html;
  wireUpComments(content);
}

function wireUpComments(container) {
  container.querySelectorAll('.comment-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      const input = container.querySelector(`.comment-input[data-key="${CSS.escape(key)}"]`);
      input.classList.toggle('visible');
      if (input.classList.contains('visible')) input.focus();
    });
  });

  container.querySelectorAll('.comment-input').forEach(input => {
    input.addEventListener('input', () => {
      const key = input.dataset.key;
      const btn = container.querySelector(`.comment-btn[data-key="${CSS.escape(key)}"]`);
      if (input.value.trim()) {
        comments[key] = input.value.trim();
        btn.classList.add('has-comment');
      } else {
        delete comments[key];
        btn.classList.remove('has-comment');
      }
      saveComments();
      updateBadge();
    });
  });
}

// === COMMENTS ===
function saveComments() {
  localStorage.setItem('cop-review-comments', JSON.stringify(comments));
}

function updateBadge() {
  document.getElementById('commentCount').textContent = Object.keys(comments).length;
}

function exportComments() {
  const blob = new Blob([JSON.stringify(comments, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cop-review-comments.json';
  a.click();
  URL.revokeObjectURL(url);
}

function submitToCopilot() {
  const keys = Object.keys(comments);
  if (keys.length === 0) {
    alert('No comments to submit.');
    return;
  }

  // Group comments by package
  const grouped = {};
  for (const [key, value] of Object.entries(comments)) {
    const parts = key.split('.');
    const pkg = parts[0];
    if (!grouped[pkg]) grouped[pkg] = [];
    const itemPath = parts.slice(1).join('.');
    grouped[pkg].push({ item: itemPath, comment: value });
  }

  // Build a prompt for Copilot CLI
  let prompt = `Process these ${keys.length} review comment(s) from the cop review app. `;
  prompt += `Each comment is an actionable request to rename, remove, or fix an API in the corresponding .cop package file.\n\n`;

  for (const [pkg, items] of Object.entries(grouped)) {
    prompt += `## ${pkg}\n`;
    for (const item of items) {
      prompt += `- ${item.item}: ${item.comment}\n`;
    }
    prompt += '\n';
  }

  navigator.clipboard.writeText(prompt).then(() => {
    // Auto-clear after successful copy
    comments = {};
    saveComments();
    updateBadge();
    alert(`Copied ${keys.length} comment(s) to clipboard and cleared queue.\nPaste into Copilot CLI.`);
    const active = document.querySelector('.tree-label.active');
    if (active) active.click();
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    comments = {};
    saveComments();
    updateBadge();
    alert(`Copied ${keys.length} comment(s) to clipboard and cleared queue.\nPaste into Copilot CLI.`);
  });
}

function clearAllComments() {
  if (!confirm('Clear all comments? This cannot be undone.')) return;
  comments = {};
  saveComments();
  updateBadge();
  const active = document.querySelector('.tree-label.active');
  if (active) {
    const pkg = active.dataset.pkg;
    const type = active.dataset.type;
    const view = active.dataset.view;
    if (type) renderType(pkg, type);
    else if (view === 'predicates') renderPredicates(pkg);
    else if (view === 'functions') renderFunctions(pkg);
    else if (view === 'checks') renderChecks(pkg);
    else if (view === 'commands') renderCommands(pkg);
    else if (view === 'lets') renderLets(pkg);
  }
}

function reviewPending() {
  const content = document.getElementById('content');
  const keys = Object.keys(comments);

  if (keys.length === 0) {
    content.innerHTML = '<h1>No Pending Comments</h1><p style="color:#57606a; margin-top:8px;">All clear! No review comments to process.</p>';
    return;
  }

  let html = '<h1>Pending Review Comments</h1>';
  html += `<p style="color:#57606a; margin-top:4px; margin-bottom:16px;">${keys.length} comment(s) pending. Dismiss resolved items individually.</p>`;

  // Group by package
  const grouped = {};
  for (const [key, value] of Object.entries(comments)) {
    const parts = key.split('.');
    const pkg = parts[0];
    if (!grouped[pkg]) grouped[pkg] = [];
    grouped[pkg].push({ key, item: parts.slice(1).join('.'), comment: value });
  }

  for (const [pkg, items] of Object.entries(grouped)) {
    html += `<h2>${pkg}</h2>`;
    for (const item of items) {
      html += `
        <div class="item-row" style="align-items: flex-start;">
          <div style="flex:1;">
            <span class="item-name">${escapeHtml(item.item)}</span>
            <div style="color:#57606a; font-size:12px; margin-top:4px; white-space:pre-wrap;">${escapeHtml(item.comment)}</div>
          </div>
          <button onclick="dismissComment('${escapeHtml(item.key)}')" style="padding:4px 10px; border:1px solid #d0d7de; border-radius:6px; background:#fff; cursor:pointer; font-size:12px; flex-shrink:0; margin-left:8px;" title="Mark as resolved">✓ Resolved</button>
        </div>
      `;
    }
  }

  content.innerHTML = html;
}

function dismissComment(key) {
  delete comments[key];
  saveComments();
  updateBadge();
  reviewPending();
}

function formatTypeLink(currentPkgId, typeStr) {
  // Handle collection types like [Statement], [Folder]
  const collMatch = typeStr.match(/^\[(.+)\]$/);
  if (collMatch) {
    const inner = collMatch[1];
    const link = makeTypeLink(currentPkgId, inner);
    return `[${link}]`;
  }
  return makeTypeLink(currentPkgId, typeStr);
}

function makeTypeLink(currentPkgId, typeName) {
  // Find which package owns this type
  for (const [pkgId, pkg] of Object.entries(packages)) {
    if (pkg.types && pkg.types[typeName]) {
      return `<a href="#" class="type-nav-link" data-pkg="${pkgId}" data-type="${typeName}">${typeName}</a>`;
    }
  }
  // Not found as a navigable type — render plain
  return typeName;
}

function wireUpTypeLinks(container) {
  container.querySelectorAll('.type-nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const pkg = link.dataset.pkg;
      const type = link.dataset.type;
      document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
      renderType(pkg, type);
    });
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
