<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cop Package Reference Review</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; color: #24292f; }

/* Sidebar */
.sidebar { width: 300px; border-right: 1px solid #d0d7de; overflow-y: auto; background: #f6f8fa; padding: 12px 0; flex-shrink: 0; }
.sidebar h2 { padding: 8px 16px; font-size: 14px; color: #57606a; text-transform: uppercase; letter-spacing: 0.5px; }
.tree-node { cursor: pointer; user-select: none; }
.tree-label { display: flex; align-items: center; padding: 4px 16px; font-size: 13px; border-radius: 6px; margin: 1px 8px; }
.tree-label:hover { background: #eaeef2; }
.tree-label.active { background: #ddf4ff; color: #0969da; font-weight: 600; }
.tree-toggle { width: 16px; font-size: 10px; color: #57606a; flex-shrink: 0; }
.tree-icon { margin-right: 6px; font-size: 12px; }
.tree-children { padding-left: 16px; }
.tree-children.collapsed { display: none; }

/* Main content */
.main { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 900px; }
.main h1 { font-size: 24px; margin-bottom: 8px; }
.main h2 { font-size: 18px; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #d0d7de; }
.main h3 { font-size: 15px; margin: 16px 0 8px; }

/* Property row */
.prop-row { display: flex; align-items: center; padding: 5px 8px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.prop-row:hover { background: #f6f8fa; }
.prop-name { font-family: 'SFMono-Regular', Consolas, monospace; font-weight: 600; width: 180px; flex-shrink: 0; }
.prop-type { color: #6639ba; width: 160px; flex-shrink: 0; font-family: monospace; font-size: 12px; }
.prop-desc { flex: 1; color: #57606a; }

/* Comment button and input */
.comment-btn { cursor: pointer; font-size: 14px; margin-left: 8px; opacity: 0.3; transition: opacity 0.2s; flex-shrink: 0; }
.comment-btn:hover { opacity: 1; }
.comment-btn.has-comment { opacity: 1; color: #0969da; }
.comment-input { display: none; width: 100%; margin-top: 4px; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 28px; }
.comment-input.visible { display: block; }
.comment-wrapper { width: 100%; }

/* Toolbar */
.toolbar { position: fixed; top: 12px; right: 24px; display: flex; gap: 8px; z-index: 100; }
.toolbar button { padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; }
.toolbar button:hover { background: #f3f4f6; }
.toolbar button.primary { background: #2da44e; color: #fff; border-color: #2da44e; }
.toolbar button.primary:hover { background: #2c974b; }
.badge { background: #0969da; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 11px; margin-left: 4px; }

/* Collection header */
.collection-header { display: flex; align-items: center; padding: 5px 8px; background: #f6f8fa; border-bottom: 1px solid #eaeef2; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

  <h2>Packages</h2>
  <div id="tree"></div>

<div class="toolbar">

// === STATE ===
let comments = JSON.parse(localStorage.getItem('cop-review-comments') || '{}');
let activeNode = null;

// === TREE RENDERING ===
function buildTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  for (const [pkgId, pkg] of Object.entries(packages)) {
    const pkgNode = document.createElement('div');
    pkgNode.className = 'tree-node';
    pkgNode.innerHTML = `
      <div class="tree-label" data-pkg="${pkgId}">
        <span class="tree-toggle">▶</span>
        <span class="tree-icon">📦</span>
        <span>${pkg.label}</span>
      </div>
      <div class="tree-children collapsed"></div>
    `;
    const childrenDiv = pkgNode.querySelector('.tree-children');
    for (const typeName of Object.keys(pkg.types)) {
      const typeNode = document.createElement('div');
      typeNode.className = 'tree-node';
      typeNode.innerHTML = `
        <div class="tree-label" data-pkg="${pkgId}" data-type="${typeName}">
          <span class="tree-toggle" style="visibility:hidden"></span>
          <span class="tree-icon">◆</span>
          <span>${typeName}</span>
        </div>
      `;
      childrenDiv.appendChild(typeNode);
    }
    tree.appendChild(pkgNode);
  }

  // Event delegation
  tree.addEventListener('click', (e) => {
    const label = e.target.closest('.tree-label');
    if (!label) return;
    const pkg = label.dataset.pkg;
    const type = label.dataset.type;
    if (type) {
      selectType(pkg, type, label);
    } else {
      // Toggle package expand
      const children = label.nextElementSibling;
      const toggle = label.querySelector('.tree-toggle');
      children.classList.toggle('collapsed');
      toggle.textContent = children.classList.contains('collapsed') ? '▶' : '▼';
    }
  });
}

function selectType(pkgId, typeName, labelEl) {
  document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
  labelEl.classList.add('active');
  renderType(pkgId, typeName);
}

// === CONTENT RENDERING ===
function renderType(pkgId, typeName) {
  const pkg = packages[pkgId];
  const type = pkg.types[typeName];
  const content = document.getElementById('content');

  let html = `<h1>${pkg.label}.${typeName}</h1>`;
  html += `<h2>Properties</h2>`;

  for (const prop of type.props) {
    const key = `${pkgId}.${typeName}.${prop.name}`;
    const hasComment = comments[key] ? 'has-comment' : '';
    html += `
      <div class="comment-wrapper">
        <div class="prop-row">
          <span class="prop-name">${prop.name}</span>
          <span class="prop-type">${escapeHtml(prop.type)}</span>
          <span class="prop-desc">${escapeHtml(prop.desc)}</span>
          <span class="comment-btn ${hasComment}" data-key="${key}" title="Add comment">💬</span>
        </div>
        <textarea class="comment-input ${comments[key] ? 'visible' : ''}" data-key="${key}" placeholder="Add comment...">${comments[key] || ''}</textarea>
      </div>
    `;
  }

  content.innerHTML = html;

  // Wire up comment buttons and inputs
  content.querySelectorAll('.comment-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      const input = content.querySelector(`.comment-input[data-key="${key}"]`);
      input.classList.toggle('visible');
      if (input.classList.contains('visible')) input.focus();
    });
  });

  content.querySelectorAll('.comment-input').forEach(input => {
    input.addEventListener('input', () => {
      const key = input.dataset.key;
      const btn = content.querySelector(`.comment-btn[data-key="${key}"]`);
      if (input.value.trim()) {
        comments[key] = input.value.trim();
        btn.classList.add('has-comment');
      } else {
        delete comments[key];
        btn.classList.remove('has-comment');
      }
      saveComments();
      updateBadge();
    });
  });
}

// === COMMENTS ===
function saveComments() {
  localStorage.setItem('cop-review-comments', JSON.stringify(comments));
}

function updateBadge() {
  document.getElementById('commentCount').textContent = Object.keys(comments).length;
}

function exportComments() {
  const blob = new Blob([JSON.stringify(comments, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cop-review-comments.json';
  a.click();
  URL.revokeObjectURL(url);
}

function clearAllComments() {
  if (!confirm('Clear all comments? This cannot be undone.')) return;
  comments = {};
  saveComments();
  updateBadge();
  // Re-render current view
  const active = document.querySelector('.tree-label.active');
  if (active) selectType(active.dataset.pkg, active.dataset.type, active);
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// === INIT ===
buildTree();
updateBadge();
</script>
</body>
</html>
